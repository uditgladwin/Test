<div class="dashboard">

  <div class="dashboard-header">

      [label]="actionLabel"
      [icon]="actionIcon"
      (buttonClick)="actionClicked.emit()">

  </div>

  <div class="widget-grid">
    <ng-content></ng-content>
  </div>

</div>
