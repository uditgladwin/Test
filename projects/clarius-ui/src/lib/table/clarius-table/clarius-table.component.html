<div class="clarius-table">
  <clarius-table-header [columns]="columns"></clarius-table-header>

  <clarius-table-row
    *ngFor="let row of rows"
    [row]="row"
    [columns]="columns"
    (click)="rowClicked.emit(row)"
    (actionClicked)="actionClicked.emit({ action: $event, row: row })">
  </clarius-table-row>
</div>
