<div class="table" [class.gradient]="gradient" [class.border-gradient]="borderGradient" [class.light-weight]="lightWeight">

  <div class="header" *ngIf="!showLabels">
    <div class="header-cell" [class.col-actions]="col.type === 'actions'" [class.col-checkbox]="col.type === 'checkbox'" *ngFor="let col of columns">
      <input *ngIf="col.type === 'checkbox'" type="checkbox" [checked]="allSelected" [indeterminate]="someSelected" (click)="toggleAll($event)" />
      <span *ngIf="col.type !== 'checkbox'">{{ col.label }}</span>
    </div>
  </div>

  <div class="row" *ngFor="let row of rows" (click)="rowClicked.emit(row)">
    <div class="cell" [class.col-actions]="col.type === 'actions'" [class.col-checkbox]="col.type === 'checkbox'" *ngFor="let col of columns">

      <ng-container *ngIf="col.type === 'checkbox'">
        <input type="checkbox" [checked]="isSelected(row)" (click)="toggleRow(row, $event)" />
      </ng-container>

      <ng-container *ngIf="!col.type || col.type === 'text'">
        <span *ngIf="showLabels" class="cell-label">{{ col.label }}</span>
        <span [style.color]="col.textColor || ''">{{ row[col.key] }}</span>
      </ng-container>

      <ng-container *ngIf="col.type === 'status'">
        <span *ngIf="showLabels" class="cell-label">{{ col.label }}</span>
        <span *ngIf="!statusDots" class="badge"
          [style.color]="getStatusColor(row[col.key])"
          [style.background]="getStatusBackground(row[col.key])"
          [style.border]="getStatusBorder(row[col.key])">
          {{ row[col.key] }}
        </span>
        <span *ngIf="statusDots" class="status-dot-wrapper">
          <span class="status-dot" [style.background]="getStatusColor(row[col.key])"></span>
          <span [style.color]="getStatusColor(row[col.key])">{{ row[col.key] }}</span>
        </span>
      </ng-container>

      <ng-container *ngIf="col.type === 'status-text'">
        <span [style.color]="getStatusColor(row[col.key])">{{ row[col.key] }}</span>
      </ng-container>

      <ng-container *ngIf="col.type === 'status-dot'">
        <span class="status-dot-wrapper">
          <span *ngIf="statusColors[row[col.key]]" class="status-dot" [style.background]="getStatusColor(row[col.key])"></span>
          <span [style.color]="statusColors[row[col.key]] ? getStatusColor(row[col.key]) : '#FFFFFF'">{{ row[col.key] }}</span>
        </span>
      </ng-container>

      <span *ngIf="col.type === 'actions'" class="actions">
        <ng-container *ngFor="let a of actions">
          <img *ngIf="a.icon && a.icon.includes('/')" class="icon-btn" [src]="a.icon" (click)="onActionClick(a.id, row, $event)" />
          <span *ngIf="a.icon && !a.icon.includes('/')" class="icon-btn" (click)="onActionClick(a.id, row, $event)">{{ a.icon }}</span>
          <clarius-button *ngIf="!a.icon"
            [label]="a.label"
            [size]="getButtonSize(a)"
            [primary]="isActionPrimary(a, row)"
            (buttonClick)="onActionButtonClick(a.id, row)">
          </clarius-button>
        </ng-container>
      </span>

    </div>
  </div>

</div>
