<div [ngSwitch]="column.type">

  <span *ngSwitchCase="'text'">
    {{ row[column.key] }}
  </span>

  <span *ngSwitchCase="'status'" class="clarius-table-status">
    {{ row[column.key] }}
  </span>

  <span *ngSwitchCase="'icon'" class="clarius-table-icon">
    {{ column.icon ? column.icon(row) : row[column.key] }}
  </span>

  <span *ngSwitchCase="'avatar'" class="clarius-table-avatar">
    <img *ngIf="row[column.key]" [src]="row[column.key]" alt="avatar" />
  </span>

  <span *ngSwitchCase="'progress'" class="clarius-table-progress">
    {{ row[column.key] }}%
  </span>

  <div *ngSwitchCase="'actions'" class="clarius-table-actions">
    <button *ngFor="let action of column.actions" (click)="actionClicked.emit(action)">
      {{ action.label }}
    </button>
  </div>

  <span *ngSwitchDefault>
    {{ row[column.key] }}
  </span>

</div>
