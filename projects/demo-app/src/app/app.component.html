<h1>Clarius Table Demo</h1>

<h2>Testbench Management</h2>
<clarius-table
  [columns]="testbenchColumns"
  [rows]="testbenchRows"
  [actions]="testbenchActions"
  [statusColors]="testbenchStatusColors"
  (rowClicked)="onRowClick($event)"
  (actionClicked)="onActionClick($event)">
</clarius-table>

<h2>Test Reports</h2>
<clarius-table
  [columns]="reportColumns"
  [rows]="reportRows"
  [actions]="reportActions"
  [statusColors]="reportStatusColors"
  (rowClicked)="onRowClick($event)"
  (actionClicked)="onActionClick($event)">
</clarius-table>
