<h1>Clarius Table Demo</h1>

<h2>Instruments</h2>
<clarius-table
  [columns]="instrumentColumns"
  [rows]="instrumentRows"
  [actions]="instrumentActions"
  (rowClicked)="onRowClick($event)"
  (actionClicked)="onActionClick($event)">
</clarius-table>

<h2>Testbench Management</h2>
<clarius-table
  [columns]="testbenchColumns"
  [rows]="testbenchRows"
  [actions]="testbenchActions"
  [statusColors]="testbenchStatusColors"
  (rowClicked)="onRowClick($event)"
  (actionClicked)="onActionClick($event)">
</clarius-table>

<h2>Instrument Services</h2>
<clarius-table
  [columns]="servicesColumns"
  [rows]="servicesRows"
  [actions]="servicesActions"
  [statusColors]="servicesStatusColors"
  [lightWeight]="true"
  (rowClicked)="onRowClick($event)"
  (actionClicked)="onActionClick($event)">
</clarius-table>

<h2>Generated Reports</h2>
<clarius-table
  [columns]="reportColumns"
  [rows]="reportRows"
  [actions]="reportActions"
  (rowClicked)="onRowClick($event)"
  (actionClicked)="onActionClick($event)">
</clarius-table>

<h2>List of Tests</h2>
<clarius-table
  [columns]="testColumns"
  [rows]="testRows"
  [actions]="testActions"
  [statusColors]="testStatusColors"
  (rowClicked)="onRowClick($event)"
  (actionClicked)="onActionClick($event)"
  (selectionChanged)="onSelectionChange($event)">
</clarius-table>

<h2>Dashboard Cards</h2>
<div class="dashboard-grid">

  <clarius-dashboard-card
    title="Sequences"
    [headerLink]="true"
    [columns]="sequenceColumns"
    [rows]="sequenceRows"
    (headerClicked)="onHeaderClick('sequences')"
    (linkClicked)="onLinkClick($event)">
  </clarius-dashboard-card>

  <clarius-dashboard-card
    title="Test Benches"
    [headerLink]="true"
    [columns]="testBenchCardColumns"
    [rows]="testBenchCardRows"
    [statusColors]="testBenchDotColors"
    (headerClicked)="onHeaderClick('testbenches')">
  </clarius-dashboard-card>

  <clarius-dashboard-card
    title="Failed Tests"
    [headerLink]="true"
    headerBackground="rgba(255, 59, 48, 0.15)"
    [showColumnHeaders]="true"
    [columns]="failedTestColumns"
    [rows]="failedTestRows"
    [statusColors]="failedTestStatusColors"
    (headerClicked)="onHeaderClick('failed-tests')">
  </clarius-dashboard-card>

  <clarius-dashboard-card
    title="Applications"
    [headerLink]="true"
    [columns]="appColumns"
    [rows]="appRows"
    (headerClicked)="onHeaderClick('applications')"
    (linkClicked)="onLinkClick($event)">
  </clarius-dashboard-card>

  <clarius-dashboard-card
    title="Running Tests"
    emptyMessage="No Tests Are Running">
  </clarius-dashboard-card>

  <clarius-dashboard-card
    title="Notifications"
    emptyMessage="There are no notifications to display.">
  </clarius-dashboard-card>

</div>
